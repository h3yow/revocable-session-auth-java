# 本地演示应用配置
spring.application.name=revocable-session-auth-java

# HMAC 密钥（仅本地演示使用；生产应通过环境变量注入）
app.security.token-secret=local-dev-hmac-secret-change-me-0123456789abcdef
# 访问令牌有效期：5 分钟（短期）
app.security.access-token-ttl-seconds=300
# 刷新令牌有效期：14 天（长期）
app.security.refresh-token-ttl-seconds=1209600

# 日志：让单元测试中“输入/判定依据/结果”可在控制台查看
logging.level.com.github.h3yow=INFO
